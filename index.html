
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영상 합치기 테스트</title>
<style>
:root {
  --red:#F04438; --blue:#3478F6; --green:#28A66A;
  --bg:#f5f6f8; --line:#e1e4e9; --text:#202124;
}
* { box-sizing:border-box }
body {
  margin:0; padding:20px 15px 45px;
  background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,sans-serif;
}
main { max-width:650px; margin:auto }
h1 { font-size:25px; margin:5px 0 }
h2 { font-size:18px; margin:0 0 13px }
p { line-height:1.5 }
.muted { font-size:13px; color:#686868 }
.card {
  background:white; border:1px solid var(--line);
  border-radius:17px; padding:16px; margin:15px 0;
}
button {
  border:0; border-radius:10px; padding:11px 13px;
  font-size:14px; font-weight:650; background:#eceef2;
  color:#202124; cursor:pointer;
}
button:disabled { opacity:.45 }
.primary { background:var(--red); color:white }
.blue { background:var(--blue); color:white }
.green { background:var(--green); color:white }
.buttons { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px }
.status {
  background:#f0f2f5; border-radius:10px; padding:12px;
  font-size:13px; line-height:1.6; overflow-wrap:anywhere;
}
input[type=text], textarea {
  width:100%; padding:11px; border:1px solid var(--line);
  border-radius:9px; font:inherit; margin-top:7px;
}
label { font-size:14px }
.clip {
  border:1px solid var(--line); border-radius:12px;
  padding:12px; margin:10px 0;
}
.clip-head { display:flex; gap:10px; align-items:center }
.clip-head input { width:20px; height:20px }
.clip-name { flex:1; min-width:0; overflow-wrap:anywhere }
.clip video { width:100%; max-height:220px; margin-top:10px; background:#111 }
.clip textarea { min-height:60px; resize:vertical }
#output {
  display:block; width:100%; background:#111;
  aspect-ratio:9/16; object-fit:contain; border-radius:12px;
}
.small { font-size:12px; color:#777 }
</style>
</head>
<body>
<main>
  <h1>영상 합치기 테스트</h1>
  <p class="muted">저장된 영상 불러오기 · 순서 변경 · 자막 · 합치기</p>

  <section class="card">
    <h2>1. 저장된 영상</h2>
    <div id="loadStatus" class="status">저장소 연결 중...</div>
    <div class="buttons">
      <button id="reloadBtn" class="blue">목록 새로고침</button>
    </div>
    <div id="clips"></div>
  </section>

  <section class="card">
    <h2>2. 편집 설정</h2>
    <label for="title">전체 제목 (선택)</label>
    <input id="title" type="text" placeholder="예: 오늘의 일상">

    <p class="muted">선택한 영상 순서대로 합쳐져. 각 영상에 자막을 따로 입력할 수 있어.</p>

    <label>
      <input id="audioToggle" type="checkbox" checked>
      원본 소리 포함
    </label>

    <p class="muted">테스트 출력은 480 × 854, 24fps로 진행해. 먼저 기능이 작동하는지 확인하기 위한 저해상도 설정이야.</p>
  </section>

  <section class="card">
    <h2>3. 합치기 및 미리보기</h2>
    <video id="output" controls playsinline></video>
    <div id="exportStatus" class="status">영상 2개 이상을 선택해 줘.</div>
    <div class="buttons">
      <button id="exportBtn" class="primary" disabled>영상 합치기 시작</button>
      <button id="downloadBtn" class="green" disabled>완성 영상 다운로드</button>
    </div>
  </section>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);
const DB_NAME = "VideoCaptureTest";
const STORE_NAME = "clips";

let db = null;
let records = [];
let outputBlob = null;
let outputUrl = null;
let busy = false;
let runToken = 0;

const canvas = document.createElement("canvas");
canvas.width = 480;
canvas.height = 854;
const ctx = canvas.getContext("2d");

const output = $("output");

function setStatus(text) {
  $("exportStatus").textContent = text;
}

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / 1024 / 1024).toFixed(2) + " MB";
}

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);

    req.onupgradeneeded = () => {
      const database = req.result;
      if (!database.objectStoreNames.contains(STORE_NAME)) {
        database.createObjectStore(STORE_NAME, {
          keyPath: "id",
          autoIncrement: true
        });
      }
    };

    req.onsuccess = () => {
      db = req.result;
      resolve();
    };

    req.onerror = () => reject(req.error);
  });
}

function getAllClips() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readonly");
    const req = tx.objectStore(STORE_NAME).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

function getSelected() {
  return [...document.querySelectorAll(".clip")]
    .filter(el => el.querySelector(".choose").checked)
    .map(el => ({
      record: records.find(r => r.id === Number(el.dataset.id)),
      subtitle: el.querySelector(".subtitle").value.trim()
    }))
    .filter(x => x.record);
}

function updateSelection() {
  const count = getSelected().length;
  $("exportBtn").disabled = busy || count < 2;
  if (!busy) {
    setStatus(count < 2
      ? "영상을 2개 이상 선택해 줘."
      : `${count}개 영상 선택됨. 목록 순서대로 합쳐져.`);
  }
}

function renderList() {
  const root = $("clips");
  root.replaceChildren();

  records.sort((a,b) => a.id - b.id);

  if (!records.length) {
    root.textContent = "저장된 영상이 없어. 이전 촬영 테스트에서 영상을 저장해 줘.";
    updateSelection();
    return;
  }

  records.forEach((r, index) => {
    const item = document.createElement("div");
    item.className = "clip";
    item.dataset.id = r.id;

    const head = document.createElement("div");
    head.className = "clip-head";

    const check = document.createElement("input");
    check.type = "checkbox";
    check.className = "choose";
    check.setAttribute("aria-label", `영상 ${r.id} 선택`);
    check.addEventListener("change", updateSelection);

    const name = document.createElement("div");
    name.className = "clip-name";

    const strong = document.createElement("strong");
    strong.textContent = `영상 ${r.id}`;

    const detail = document.createElement("div");
    detail.className = "small";
    detail.textContent = `${fmtSize(r.blob.size)} · ${r.mime || r.blob.type}`;

    name.append(strong, detail);

    const up = document.createElement("button");
    up.textContent = "↑";
    up.title = "위로 이동";
    up.disabled = index === 0;
    up.addEventListener("click", () => moveItem(item, -1));

    const down = document.createElement("button");
    down.textContent = "↓";
    down.title = "아래로 이동";
    down.disabled = index === records.length - 1;
    down.addEventListener("click", () => moveItem(item, 1));

    head.append(check, name, up, down);

    const vid = document.createElement("video");
    vid.controls = true;
    vid.playsInline = true;
    vid.preload = "metadata";
    vid.src = URL.createObjectURL(r.blob);

    const label = document.createElement("label");
    label.textContent = "이 영상에 표시할 자막";

    const subtitle = document.createElement("textarea");
    subtitle.className = "subtitle";
    subtitle.placeholder = "예: 학교 가는 길";
    subtitle.maxLength = 200;

    item.append(head, vid, label, subtitle);
    root.append(item);
  });

  updateSelection();
}

function moveItem(item, direction) {
  const root = $("clips");
  const items = [...root.children];
  const i = items.indexOf(item);
  const j = i + direction;

  if (j < 0 || j >= items.length) return;

  if (direction < 0) root.insertBefore(item, items[j]);
  else root.insertBefore(items[j], item);

  [...root.children].forEach((el, idx, arr) => {
    const buttons = el.querySelectorAll(".clip-head button");
    buttons[0].disabled = idx === 0;
    buttons[1].disabled = idx === arr.length - 1;
  });

  updateSelection();
}

async function reload() {
  try {
    if (!db) await openDB();
    records = await getAllClips();
    $("loadStatus").textContent = `저장된 영상 ${records.length}개를 불러왔어.`;
    renderList();
  } catch (error) {
    $("loadStatus").textContent =
      "저장소 연결 실패: " + error.message +
      ". 이전 테스트와 같은 사이트 주소인지 확인해 줘.";
  }
}

$("reloadBtn").addEventListener("click", reload);

function drawCover(video) {
  ctx.fillStyle = "#111";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const vw = video.videoWidth;
  const vh = video.videoHeight;
  if (!vw || !vh) return;

  const scale = Math.max(canvas.width / vw, canvas.height / vh);
  const sw = canvas.width / scale;
  const sh = canvas.height / scale;

  ctx.drawImage(
    video,
    (vw - sw) / 2, (vh - sh) / 2, sw, sh,
    0, 0, canvas.width, canvas.height
  );
}

function drawText(text, x, y, maxWidth, fontSize) {
  ctx.save();
  ctx.font = `600 ${fontSize}px system-ui, sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#fff";
  ctx.shadowColor = "rgba(0,0,0,.9)";
  ctx.shadowBlur = 5;

  const lines = [];
  let line = "";

  for (const char of [...text]) {
    if (ctx.measureText(line + char).width > maxWidth && line) {
      lines.push(line);
      line = char;
    } else {
      line += char;
    }
  }
  if (line) lines.push(line);

  const height = fontSize * 1.35;
  const start = y - (lines.length - 1) * height / 2;

  lines.forEach((part, i) => {
    ctx.fillText(part, x, start + i * height, maxWidth);
  });

  ctx.restore();
}

function drawFrame(video, subtitle, title) {
  drawCover(video);

  if (title) {
    ctx.fillStyle = "rgba(0,0,0,.3)";
    ctx.fillRect(0, 0, canvas.width, 90);
    drawText(title, canvas.width / 2, 45, 430, 25);
  }

  if (subtitle) {
    ctx.fillStyle = "rgba(0,0,0,.25)";
    ctx.fillRect(0, 570, canvas.width, 180);
    drawText(subtitle, canvas.width / 2, 660, 420, 29);
  }
}

function waitForEvent(target, successEvent, timeoutMs = 12000) {
  return new Promise((resolve, reject) => {
    let done = false;

    const cleanup = () => {
      clearTimeout(timer);
      target.removeEventListener(successEvent, onSuccess);
      target.removeEventListener("error", onError);
    };

    const finish = (error) => {
      if (done) return;
      done = true;
      cleanup();
      if (error) reject(error);
      else resolve();
    };

    const onSuccess = () => finish();
    const onError = () => finish(new Error("브라우저에서 영상을 읽지 못했어."));

    const timer = setTimeout(
      () => finish(new Error("영상 준비 시간 초과. 다시 시도해 줘.")),
      timeoutMs
    );

    target.addEventListener(successEvent, onSuccess);
    target.addEventListener("error", onError);
  });
}

async function loadSourceVideo(video, blob) {
  video.pause();

  if (video._testUrl) URL.revokeObjectURL(video._testUrl);

  video.removeAttribute("src");
  video.load();

  const url = URL.createObjectURL(blob);
  video._testUrl = url;

  const loaded = waitForEvent(video, "loadeddata", 12000);
  video.src = url;
  video.load();

  if (video.readyState < 2) {
    await loaded;
  } else {
    // 준비가 이미 완료된 경우에도 대기 Promise를 정리하기 위해
    // loadeddata 이벤트가 발생하지 않을 수 있으므로 별도 대기를 하지 않음.
    loaded.catch(() => {});
  }

  if (video.readyState < 2) {
    throw new Error("영상 데이터가 준비되지 않았어.");
  }
}

function waitForRecorderStop(recorder) {
  return new Promise((resolve, reject) => {
    recorder.addEventListener("stop", resolve, { once:true });
    recorder.addEventListener("error", () => {
      reject(new Error("출력 인코딩 도중 오류가 발생했어."));
    }, { once:true });
  });
}

async function exportVideo() {
  if (busy) return;

  const selected = getSelected();
  if (selected.length < 2) {
    alert("영상을 2개 이상 선택해 줘.");
    return;
  }

  if (!window.MediaRecorder || !canvas.captureStream) {
    alert("이 브라우저는 영상 출력 기능을 지원하지 않아.");
    return;
  }

  const mimeTypes = [
    "video/mp4;codecs=avc1.42E01E",
    "video/mp4"
  ];

  const mime = mimeTypes.find(type => MediaRecorder.isTypeSupported(type));

  if (!mime) {
    alert("이 브라우저에서 MP4 녹화가 지원되지 않아.");
    return;
  }

  busy = true;
  const token = ++runToken;
  $("exportBtn").disabled = true;
  $("downloadBtn").disabled = true;
  outputBlob = null;

  let source = document.createElement("video");
  source.playsInline = true;
  source.preload = "auto";
  source.muted = true;

  let stream = null;
  let recorder = null;
  let audioContext = null;
  let audioSource = null;
  let audioDestination = null;
  let frameId = 0;
  let cancelled = false;
  const chunks = [];

  try {
    stream = canvas.captureStream(24);

    if ($("audioToggle").checked) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;

      if (AudioCtx) {
        audioContext = new AudioCtx();
        await audioContext.resume();

        audioDestination = audioContext.createMediaStreamDestination();
        audioSource = audioContext.createMediaElementSource(source);
        audioSource.connect(audioDestination);
        audioSource.connect(audioContext.destination);

        const track = audioDestination.stream.getAudioTracks()[0];
        if (track) stream.addTrack(track);
      }
    }

    recorder = new MediaRecorder(stream, {
      mimeType: mime,
      videoBitsPerSecond: 1500000
    });

    recorder.ondataavailable = event => {
      if (event.data && event.data.size) chunks.push(event.data);
    };

    const stopped = waitForRecorderStop(recorder);
    recorder.start(500);

    const title = $("title").value.trim();

    function render(subtitle) {
      if (cancelled || token !== runToken) return;
      if (source.readyState >= 2) drawFrame(source, subtitle, title);
      frameId = requestAnimationFrame(() => render(subtitle));
    }

    for (let i = 0; i < selected.length; i++) {
      const entry = selected[i];

      setStatus(`영상 ${i + 1}/${selected.length}: 파일 불러오는 중...`);
      await loadSourceVideo(source, entry.record.blob);

      setStatus(`영상 ${i + 1}/${selected.length}: 재생 준비 중...`);

      source.currentTime = 0;
      if (source.readyState < 2) {
        await waitForEvent(source, "loadeddata", 12000);
      }

      source.muted = !$("audioToggle").checked;
      source.volume = 1;

      drawFrame(source, entry.subtitle, title);
      cancelAnimationFrame(frameId);
      render(entry.subtitle);

      await source.play();

      setStatus(`영상 ${i + 1}/${selected.length}: 재생 및 합성 중...`);

      await new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error("영상 재생이 너무 오래 걸려 중단했어."));
        }, 45000);

        const onEnded = () => {
          cleanup();
          resolve();
        };

        const onError = () => {
          cleanup();
          reject(new Error("영상 재생 도중 오류가 발생했어."));
        };

        function cleanup() {
          clearTimeout(timer);
          source.removeEventListener("ended", onEnded);
          source.removeEventListener("error", onError);
        }

        source.addEventListener("ended", onEnded);
        source.addEventListener("error", onError);
      });

      source.pause();
    }

    cancelled = true;
    cancelAnimationFrame(frameId);

    // 마지막 프레임을 캔버스에 그린 뒤 녹화를 종료함
    drawFrame(source, "", title);

    await new Promise(resolve => setTimeout(resolve, 150));
    recorder.stop();
    await stopped;

    if (!chunks.length) throw new Error("출력된 영상 데이터가 없어.");

    outputBlob = new Blob(chunks, { type: recorder.mimeType || mime });

    if (!outputBlob.size) throw new Error("출력 파일이 비어 있어.");

    if (outputUrl) URL.revokeObjectURL(outputUrl);
    outputUrl = URL.createObjectURL(outputBlob);

    output.src = outputUrl;
    output.load();

    setStatus(
      `출력 완료 · ${fmtSize(outputBlob.size)} · ${outputBlob.type}. ` +
      "미리보기를 확인해 줘."
    );

    $("downloadBtn").disabled = false;

  } catch (error) {
    cancelled = true;
    cancelAnimationFrame(frameId);

    if (recorder && recorder.state !== "inactive") {
      try { recorder.stop(); } catch {}
    }

    setStatus("실패: " + error.message);
  } finally {
    busy = false;
    $("exportBtn").disabled = getSelected().length < 2;

    source.pause();
    if (source._testUrl) URL.revokeObjectURL(source._testUrl);
    source.removeAttribute("src");
    source.load();

    if (stream) stream.getTracks().forEach(track => track.stop());

    if (audioContext) {
      try { await audioContext.close(); } catch {}
    }
  }
}

$("exportBtn").addEventListener("click", exportVideo);

$("downloadBtn").addEventListener("click", () => {
  if (!outputBlob || !outputBlob.size) return;

  if (!outputBlob.type.toLowerCase().includes("mp4")) {
    alert("결과 파일 형식이 MP4가 아니야: " + outputBlob.type);
    return;
  }

  const url = URL.createObjectURL(outputBlob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "video-test-export.mp4";
  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(() => URL.revokeObjectURL(url), 60000);
});

window.addEventListener("beforeunload", () => {
  runToken++;
  if (outputUrl) URL.revokeObjectURL(outputUrl);
});

reload();
</script>
</body>
</html>

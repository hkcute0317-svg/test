
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영상 촬영 테스트</title>

<style>
:root {
  --red: #F04438;
  --yellow: #F5C542;
  --green: #28A66A;
  --blue: #3478F6;
  --bg: #f6f7f9;
  --line: #e4e6eb;
  --text: #202124;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px 16px 40px;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
}
main { max-width: 560px; margin: auto; }
h1 { font-size: 25px; margin: 8px 0; }
h2 { font-size: 18px; margin: 0 0 14px; }
p { line-height: 1.55; }
.muted { color: #666; font-size: 13px; }
.card {
  background: white;
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 17px;
  margin: 16px 0;
}
video {
  width: 100%;
  display: block;
  background: #171717;
  border-radius: 12px;
  aspect-ratio: 9 / 16;
  object-fit: contain;
}
button {
  border: 0;
  border-radius: 11px;
  padding: 12px 14px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  background: #eceef2;
  color: var(--text);
}
button:disabled { opacity: .4; cursor: default; }
.primary { background: var(--red); color: white; }
.secondary { background: var(--blue); color: white; }
.success { background: var(--green); color: white; }
.warning { background: var(--yellow); color: #222; }
.buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.status {
  padding: 12px;
  background: #f1f3f5;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}
.clip {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  margin-top: 12px;
}
.clip video {
  aspect-ratio: 9 / 16;
  max-height: 260px;
  margin: 10px 0;
}
label { font-size: 13px; }
input[type="text"] {
  width: 100%;
  padding: 11px;
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: 15px;
  margin-top: 6px;
}
</style>
</head>

<body>
<main>
  <h1>영상 촬영 테스트</h1>
  <p class="muted">
    카메라 촬영 · 영상 재생 · 브라우저 내부 저장소 확인
  </p>

  <section class="card">
    <h2>1. 카메라 촬영</h2>
    <video id="camera" autoplay muted playsinline></video>

    <div class="buttons">
      <button id="cameraBtn" class="secondary">카메라 켜기</button>
      <button id="startBtn" class="primary" disabled>촬영 시작</button>
      <button id="stopBtn" disabled>촬영 종료</button>
    </div>

    <p id="recordStatus" class="status">카메라를 켜 주세요.</p>
    <p class="muted">
      처음에는 카메라 권한을 허용해야 해.
      촬영은 최대 60초까지만 진행할 수 있어.
    </p>
  </section>

  <section class="card">
    <h2>2. 촬영한 영상 확인</h2>
    <video id="preview" controls playsinline></video>
    <p id="previewInfo" class="muted">아직 촬영한 영상이 없어.</p>

    <div class="buttons">
      <button id="saveBtn" class="success" disabled>내부 저장소에 저장</button>
      <button id="discardBtn" disabled>다시 촬영하기</button>
    </div>
  </section>

  <section class="card">
    <h2>3. 저장된 영상</h2>
    <p class="muted">
      이 목록의 영상은 휴대폰의 다운로드 폴더가 아니라
      브라우저 내부 저장소에 저장돼.
    </p>
    <div id="storageStatus" class="status">저장소 확인 중...</div>
    <div id="clips"></div>
  </section>

  <section class="card">
    <h2>4. 테스트 결과 기록</h2>
    <label for="notes">확인한 내용이나 오류</label>
    <input id="notes" type="text" placeholder="예: 촬영 성공, 재접속 후에도 영상 유지">
    <div class="buttons">
      <button id="copyResult" class="warning">결과 복사</button>
    </div>
    <p class="muted">결과를 복사해서 메모해 두면 다음 단계에 활용할 수 있어.</p>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);

const camera = $("camera");
const preview = $("preview");
const cameraBtn = $("cameraBtn");
const startBtn = $("startBtn");
const stopBtn = $("stopBtn");
const saveBtn = $("saveBtn");
const discardBtn = $("discardBtn");

let stream = null;
let recorder = null;
let chunks = [];
let currentBlob = null;
let currentMime = "";
let currentUrl = null;
let recordingTimer = null;
let startedAt = 0;
let db = null;

const DB_NAME = "VideoCaptureTest";
const STORE_NAME = "clips";

function setStatus(message) {
  $("recordStatus").textContent = message;
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / 1024 / 1024).toFixed(2) + " MB";
}

function formatDate(timestamp) {
  return new Date(timestamp).toLocaleString("ko-KR");
}

function openDatabase() {
  return new Promise((resolve, reject) => {
    if (!("indexedDB" in window)) {
      reject(new Error("이 브라우저는 IndexedDB를 지원하지 않아."));
      return;
    }

    const request = indexedDB.open(DB_NAME, 1);

    request.onupgradeneeded = () => {
      const database = request.result;

      if (!database.objectStoreNames.contains(STORE_NAME)) {
        database.createObjectStore(STORE_NAME, {
          keyPath: "id",
          autoIncrement: true
        });
      }
    };

    request.onsuccess = () => {
      db = request.result;
      resolve(db);
    };

    request.onerror = () => reject(request.error);
  });
}

function transaction(mode, action) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, mode);
    const store = tx.objectStore(STORE_NAME);
    let request;

    try {
      request = action(store);
    } catch (error) {
      reject(error);
      return;
    }

    tx.oncomplete = () => resolve(request ? request.result : undefined);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error("저장 작업이 중단됐어."));
  });
}

async function refreshStorageStatus() {
  try {
    if (navigator.storage && navigator.storage.estimate) {
      const estimate = await navigator.storage.estimate();
      const used = formatSize(estimate.usage || 0);
      const quota = estimate.quota
        ? formatSize(estimate.quota)
        : "확인 불가";

      $("storageStatus").textContent =
        `브라우저 저장소 사용량: ${used} / 추정 한도: ${quota}`;
    } else {
      $("storageStatus").textContent =
        "이 브라우저에서는 저장소 사용량을 확인할 수 없어.";
    }
  } catch (error) {
    $("storageStatus").textContent =
      "저장소 사용량을 확인하지 못했어: " + error.message;
  }
}

async function loadClips() {
  try {
    const clips = await transaction("readonly", store => store.getAll());
    const container = $("clips");
    container.replaceChildren();

    if (!clips.length) {
      container.textContent = "저장된 영상이 없어.";
    }

    for (const clip of clips.sort((a, b) => a.id - b.id)) {
      const item = document.createElement("div");
      item.className = "clip";

      const title = document.createElement("strong");
      title.textContent = `영상 ${clip.id}`;

      const info = document.createElement("p");
      info.className = "muted";
      info.textContent =
        `${formatDate(clip.createdAt)} · ${formatSize(clip.blob.size)} · ${clip.mime}`;

      const video = document.createElement("video");
      video.controls = true;
      video.playsInline = true;
      video.src = URL.createObjectURL(clip.blob);

      const remove = document.createElement("button");
      remove.textContent = "이 영상 삭제";
      remove.addEventListener("click", async () => {
        if (!confirm("브라우저 내부 저장소에서 이 영상을 삭제할까?")) return;

        try {
          await transaction("readwrite", store => store.delete(clip.id));
          video.pause();
          URL.revokeObjectURL(video.src);
          await loadClips();
        } catch (error) {
          alert("삭제 실패: " + error.message);
        }
      });

      item.append(title, info, video, remove);
      container.append(item);
    }

    await refreshStorageStatus();
  } catch (error) {
    $("storageStatus").textContent = "영상 목록을 불러오지 못했어: " + error.message;
  }
}

cameraBtn.addEventListener("click", async () => {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error("카메라 기능을 사용할 수 없어. HTTPS 주소로 접속했는지 확인해 줘.");
    }

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: true
    });

    camera.srcObject = stream;
    await camera.play();

    startBtn.disabled = false;
    cameraBtn.textContent = "카메라 다시 켜기";
    setStatus("카메라가 켜졌어. 촬영을 시작해 봐.");
  } catch (error) {
    setStatus("카메라 실행 실패: " + error.name + " — " + error.message);
  }
});

startBtn.addEventListener("click", () => {
  if (!stream) return;

  try {
    chunks = [];

    const candidates = [
      "video/mp4;codecs=avc1.42E01E,mp4a.40.2",
      "video/mp4",
      "video/webm;codecs=vp9,opus",
      "video/webm;codecs=vp8,opus",
      "video/webm"
    ];

    const mime = candidates.find(type =>
      window.MediaRecorder &&
      MediaRecorder.isTypeSupported &&
      MediaRecorder.isTypeSupported(type)
    );

    if (!window.MediaRecorder) {
      throw new Error("이 브라우저에서 MediaRecorder를 지원하지 않아.");
    }

    recorder = mime
      ? new MediaRecorder(stream, { mimeType: mime })
      : new MediaRecorder(stream);

    currentMime = recorder.mimeType || mime || "video/webm";

    recorder.ondataavailable = event => {
      if (event.data && event.data.size > 0) {
        chunks.push(event.data);
      }
    };

    recorder.onerror = event => {
      setStatus("녹화 중 오류: " + (event.error?.message || "알 수 없는 오류"));
    };

    recorder.onstop = () => {
      clearInterval(recordingTimer);

      currentBlob = new Blob(chunks, { type: currentMime });
      if (currentUrl) URL.revokeObjectURL(currentUrl);
      currentUrl = URL.createObjectURL(currentBlob);

      preview.src = currentUrl;
      preview.load();

      $("previewInfo").textContent =
        `촬영 시간 약 ${Math.round((Date.now() - startedAt) / 1000)}초 · ` +
        `${formatSize(currentBlob.size)} · ${currentMime}`;

      saveBtn.disabled = currentBlob.size === 0;
      discardBtn.disabled = false;
      startBtn.disabled = false;
      stopBtn.disabled = true;

      setStatus("촬영이 끝났어. 영상을 확인한 뒤 저장해 봐.");
    };

    recorder.start(1000);
    startedAt = Date.now();

    startBtn.disabled = true;
    stopBtn.disabled = false;
    saveBtn.disabled = true;
    discardBtn.disabled = true;

    setStatus("촬영 중... 60초가 지나면 자동으로 종료돼.");

    recordingTimer = setInterval(() => {
      const seconds = Math.floor((Date.now() - startedAt) / 1000);
      setStatus(`촬영 중... ${seconds}초 / 60초`);

      if (seconds >= 60 && recorder && recorder.state === "recording") {
        recorder.stop();
      }
    }, 250);

  } catch (error) {
    setStatus("촬영 시작 실패: " + error.name + " — " + error.message);
    startBtn.disabled = false;
    stopBtn.disabled = true;
  }
});

stopBtn.addEventListener("click", () => {
  if (recorder && recorder.state === "recording") {
    recorder.stop();
  }
});

saveBtn.addEventListener("click", async () => {
  if (!currentBlob || !currentBlob.size) return;

  saveBtn.disabled = true;

  try {
    await transaction("readwrite", store => store.add({
      blob: currentBlob,
      mime: currentBlob.type || currentMime,
      createdAt: Date.now()
    }));

    setStatus("저장 성공! 아래 목록에서 영상을 다시 재생할 수 있어.");
    currentBlob = null;
    saveBtn.disabled = true;
    discardBtn.disabled = true;

    await loadClips();
  } catch (error) {
    saveBtn.disabled = false;
    setStatus("저장 실패: " + error.message +
      " — 저장 공간이나 브라우저 설정을 확인해 줘.");
  }
});

discardBtn.addEventListener("click", () => {
  if (currentUrl) URL.revokeObjectURL(currentUrl);
  currentUrl = null;
  currentBlob = null;
  preview.removeAttribute("src");
  preview.load();

  $("previewInfo").textContent = "다음 영상을 촬영할 수 있어.";
  saveBtn.disabled = true;
  discardBtn.disabled = true;

  if (stream) {
    startBtn.disabled = false;
    setStatus("다시 촬영할 수 있어.");
  } else {
    startBtn.disabled = true;
    setStatus("카메라를 먼저 켜 줘.");
  }
});

$("copyResult").addEventListener("click", async () => {
  const saved = $("clips").querySelectorAll(".clip").length;
  const result = [
    "영상 촬영 테스트 결과",
    "날짜: " + new Date().toLocaleString("ko-KR"),
    "카메라 사용: " + (stream ? "성공" : "미확인"),
    "저장된 영상 개수: " + saved,
    "현재 촬영 형식: " + (currentMime || "미확인"),
    "메모: " + $("notes").value
  ].join("\n");

  try {
    await navigator.clipboard.writeText(result);
    alert("테스트 결과를 복사했어.");
  } catch {
    prompt("아래 결과를 복사해 줘.", result);
  }
});

window.addEventListener("beforeunload", () => {
  if (stream) stream.getTracks().forEach(track => track.stop());
  if (currentUrl) URL.revokeObjectURL(currentUrl);
});

(async function init() {
  try {
    await openDatabase();
    await loadClips();
    setStatus("준비 완료. 카메라를 켜 줘.");
  } catch (error) {
    setStatus("초기화 실패: " + error.message);
    $("storageStatus").textContent =
      "브라우저 내부 저장소를 열지 못했어. HTTPS 환경에서 다시 시도해 줘.";
  }
})();
</script>
</body>
</html>
